services:
  synapse-core:
    build:
      context: ..
      dockerfile: containers/core/Dockerfile
    image: synapse-local/core:v1.6.0
    container_name: synapse-core
    hostname: synapse-core
    restart: unless-stopped
    environment:
      - NODE_ENV=production
      - PORT=3000
      - HOSTNAME=0.0.0.0
      - SYNAPSE_DATA_DIR=/var/lib/synapse
      - SYNAPSE_VAULT_DIR=/var/lib/synapse/projects
      - SYNAPSE_CARTRIDGES_DIR=/app/cartridges
      - SYNAPSE_TUNNEL_PORT=8443
      - SYNAPSE_GATEWAY_HTTP_ADDR=:8081
      - CORE_GATEWAY_URL=http://127.0.0.1:8081
      - CORE_GATEWAY_INTERNAL_URL=http://127.0.0.1:8081
      - SYNAPSE_MASTER_KEY=${SYNAPSE_MASTER_KEY:-synapse-local-aes-256-gcm-master-key}
    ports:
      - "3000:3000"
      - "8081:8081"
      - "8443:8443"
    volumes:
      - ./core/data:/var/lib/synapse
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8081/healthz"]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 5s

  synapse-muscle:
    build:
      context: ..
      dockerfile: containers/muscle/Dockerfile
    image: synapse-local/muscle:v1.6.0
    container_name: synapse-muscle
    hostname: synapse-muscle
    restart: unless-stopped
    depends_on:
      synapse-core:
        condition: service_healthy
    environment:
      - SYNAPSE_CORE_HTTP_URL=http://synapse-core:8081
      - SYNAPSE_CORE_TUNNEL_ADDR=synapse-core:8443
      - AXON_NODE_ID=local-muscle
      - AXON_TIER=TIER_1_UNLEASHED
      - AXON_CONFIG_DIR=/etc/axon
      - AXON_WORKSPACE_DIR=/opt/axon/workspaces
    volumes:
      - ./muscle/config:/etc/axon
      - ./muscle/workspaces:/opt/axon/workspaces
