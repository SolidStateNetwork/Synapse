name: Synapse Release — Multi-Arch Binaries & GitHub Release

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:
    inputs:
      tag_name:
        description: "Release tag (e.g. v0.1.0)"
        required: true
        default: "v0.1.0"

permissions:
  contents: write

jobs:
  release-binaries:
    name: Build & Publish Multi-Arch Binaries
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Go 1.23
        uses: actions/setup-go@v5
        with:
          go-version: "1.23"
          cache-dependency-path: |
            agents/axon/go.sum
            apps/core-gateway/go.sum

      - name: Run Verification Suite
        env:
          CGO_ENABLED: "0"
        run: go test -v ./proto/... ./agents/axon/... ./apps/core-gateway/...

      - name: Cross-Compile Static Binaries (Axon Muscle + Core Gateway)
        env:
          CGO_ENABLED: "0"
        run: |
          mkdir -p release-dist
          VERSION="${GITHUB_REF_NAME:-v0.1.0}"
          COMMIT="$(git rev-parse --short HEAD)"
          LDFLAGS="-s -w -X main.version=${VERSION} -X main.commit=${COMMIT}"

          # Axon Muscle Agent (Linux & macOS)
          GOOS=linux GOARCH=amd64 go build -C agents/axon -ldflags="${LDFLAGS}" -o ../../release-dist/axon-linux-amd64 ./cmd/axon
          GOOS=linux GOARCH=arm64 go build -C agents/axon -ldflags="${LDFLAGS}" -o ../../release-dist/axon-linux-arm64 ./cmd/axon
          GOOS=darwin GOARCH=amd64 go build -C agents/axon -ldflags="${LDFLAGS}" -o ../../release-dist/axon-darwin-amd64 ./cmd/axon
          GOOS=darwin GOARCH=arm64 go build -C agents/axon -ldflags="${LDFLAGS}" -o ../../release-dist/axon-darwin-arm64 ./cmd/axon

          # Core Gateway Hub (Linux)
          GOOS=linux GOARCH=amd64 go build -C apps/core-gateway -ldflags="-s -w" -o ../../release-dist/core-gateway-linux-amd64 .
          GOOS=linux GOARCH=arm64 go build -C apps/core-gateway -ldflags="-s -w" -o ../../release-dist/core-gateway-linux-arm64 .

          # Generate SHA-256 Checksums
          cd release-dist
          sha256sum axon-* core-gateway-* > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.inputs.tag_name || github.ref_name }}
          name: "Synapse ${{ github.event.inputs.tag_name || github.ref_name }} — Brain & Muscle Platform"
          generate_release_notes: true
          files: |
            release-dist/axon-linux-amd64
            release-dist/axon-linux-arm64
            release-dist/axon-darwin-amd64
            release-dist/axon-darwin-arm64
            release-dist/core-gateway-linux-amd64
            release-dist/core-gateway-linux-arm64
            release-dist/SHA256SUMS.txt
          body: |
            ## Synapse ${{ github.event.inputs.tag_name || github.ref_name }} — "Brain & Muscle" Reference Release

            ### Architecture Highlights
            - **The Brain (`synapse-core`)**: Stateless Next.js 15 Control Plane (`core-web`) + Go mTLS 1.3 & `hashicorp/yamux` Multiplexing Hub (`core-gateway`).
            - **The Muscle (`axon`)**: Single-binary (`CGO_ENABLED=0`) remote execution agent with persistent sentinel-framed PTYs, atomic filesystem engine, 5-second `gopsutil` telemetry, and live loopback port forwarding.
            - **Security & Guardrails**: Deterministic Self-Lockout Prevention (`ERR_SELF_PROTECTION_VIOLATION`), AES-256-GCM Secret Vault (`Secrets.enc`) with real-time stream redaction, 16 KB Head/Tail output truncation, and `TIER_1_UNLEASHED` / `TIER_2_WORKSPACE_JAIL` / `TIER_3_SUPERVISED` autonomy enforcement.

            ### Quick Install (Axon Muscle Node)
            ```bash
            curl -fL https://github.com/SolidStateNetwork/Synapse/releases/download/${{ github.event.inputs.tag_name || github.ref_name }}/axon-linux-amd64 -o /usr/local/bin/axon
            chmod +x /usr/local/bin/axon
            axon version
            ```
