name: Synapse Release — Multi-Arch Binaries & GitHub Release

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:
    inputs:
      tag_name:
        description: "Release tag (e.g. v0.3.0)"
        required: true
        default: "v0.3.0"

permissions:
  contents: write
  packages: write

jobs:
  release-binaries:
    name: Build & Publish Multi-Arch Binaries + GHCR Docker Images
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Go 1.23
        uses: actions/setup-go@v5
        with:
          go-version: "1.23"
          cache-dependency-path: |
            packages/proto/go.sum
            agents/axon/go.sum
            apps/core-gateway/go.sum

      - name: Run Verification Suite
        env:
          CGO_ENABLED: "0"
        run: go test -v ./packages/proto/... ./agents/axon/... ./apps/core-gateway/...

      - name: Cross-Compile Static Binaries (Axon Muscle + Core Gateway)
        env:
          CGO_ENABLED: "0"
        run: |
          mkdir -p release-dist
          VERSION="${GITHUB_REF_NAME:-v0.3.0}"
          if [[ "$VERSION" != v* ]]; then
            VERSION="v0.3.0"
          fi
          COMMIT="$(git rev-parse --short HEAD)"
          LDFLAGS="-s -w -X main.version=${VERSION} -X main.commit=${COMMIT}"

          # Axon Muscle Agent (Linux & macOS)
          GOOS=linux GOARCH=amd64 go build -C agents/axon -ldflags="${LDFLAGS}" -o ../../release-dist/axon-linux-amd64 ./cmd/axon
          GOOS=linux GOARCH=arm64 go build -C agents/axon -ldflags="${LDFLAGS}" -o ../../release-dist/axon-linux-arm64 ./cmd/axon
          GOOS=darwin GOARCH=amd64 go build -C agents/axon -ldflags="${LDFLAGS}" -o ../../release-dist/axon-darwin-amd64 ./cmd/axon
          GOOS=darwin GOARCH=arm64 go build -C agents/axon -ldflags="${LDFLAGS}" -o ../../release-dist/axon-darwin-arm64 ./cmd/axon

          # Core Gateway Hub (Linux)
          GOOS=linux GOARCH=amd64 go build -C apps/core-gateway -ldflags="-s -w" -o ../../release-dist/core-gateway-linux-amd64 .
          GOOS=linux GOARCH=arm64 go build -C apps/core-gateway -ldflags="-s -w" -o ../../release-dist/core-gateway-linux-arm64 .

          # Include deployment & one-line installer scripts in release assets
          cp scripts/deploy-core.sh release-dist/deploy-core.sh
          cp scripts/install-axon.sh release-dist/install-axon.sh

          # Generate SHA-256 Checksums
          cd release-dist
          sha256sum axon-* core-gateway-* deploy-core.sh install-axon.sh > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - name: Log in to GitHub Container Registry (GHCR)
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build & Push synapse-core-gateway Docker Image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/core-gateway/Dockerfile
          push: true
          tags: |
            ghcr.io/solidstatenetwork/synapse-core-gateway:latest
            ghcr.io/solidstatenetwork/synapse-core-gateway:${{ github.event.inputs.tag_name || github.ref_name }}

      - name: Build & Push synapse-core-web Docker Image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/core-web/Dockerfile
          push: true
          tags: |
            ghcr.io/solidstatenetwork/synapse-core-web:latest
            ghcr.io/solidstatenetwork/synapse-core-web:${{ github.event.inputs.tag_name || github.ref_name }}

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.inputs.tag_name || github.ref_name }}
          name: "Synapse ${{ github.event.inputs.tag_name || github.ref_name }} — Brain & Muscle Platform"
          generate_release_notes: true
          files: |
            release-dist/axon-linux-amd64
            release-dist/axon-linux-arm64
            release-dist/axon-darwin-amd64
            release-dist/axon-darwin-arm64
            release-dist/core-gateway-linux-amd64
            release-dist/core-gateway-linux-arm64
            release-dist/deploy-core.sh
            release-dist/install-axon.sh
            release-dist/SHA256SUMS.txt
          body: |
            ## Synapse ${{ github.event.inputs.tag_name || github.ref_name }} — Docker Core Deployment & One-Command Connector Enrollment

            ### 1. Deploy the Core ("The Brain") via Docker
            Run on your control-plane server:
            ```bash
            curl -fsSL https://raw.githubusercontent.com/SolidStateNetwork/Synapse/main/scripts/deploy-core.sh | bash
            ```
            Or via `docker-compose.yml` using prebuilt GHCR images (`ghcr.io/solidstatenetwork/synapse-core-gateway:latest` & `ghcr.io/solidstatenetwork/synapse-core-web:latest`):
            ```bash
            curl -fsSL https://raw.githubusercontent.com/SolidStateNetwork/Synapse/main/docker-compose.yml -o docker-compose.yml
            docker compose pull && docker compose up -d
            ```

            ### 2. Connect any Remote Muscle Node (`axon`) with One Command + Token Login
            Generate a one-time join token in the Studio WebUI (`Server & Mesh -> Server koppeln`), then run on the target Linux server:
            ```bash
            curl -fsSL http://<CORE_HOST>:8081/install.sh | sudo sh -s -- <ONE_TIME_JOIN_TOKEN> TIER_2_WORKSPACE_JAIL
            ```
            The installer automatically detects `amd64`/`arm64`, downloads the static `axon` binary, logs in to the Core using your one-time token (exchanging an ECDSA P-256 CSR for a signed mTLS 1.3 client certificate), starts `axon.service` via `systemd`, and auto-binds the node to your project!
