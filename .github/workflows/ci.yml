name: Synapse CI — Brain & Muscle Build Pipeline

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

permissions:
  contents: read
  packages: write

jobs:
  build-and-test-go:
    name: Build & Test Go Modules (Axon Muscle + Core Gateway)
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7

      - name: Verify Clean Repo Hygiene & < 600 Line Modularization Gate
        run: |
          P1="217\\.154\\.20""\\.24"
          P2="/home/""denis"
          P3="vps""2"
          P4="cachy""os"
          P5="synapse-cloud-""demo"
          P6="pulse-""webui|pulse-""analytics|pulse-""sqlite"
          P7="uptime-beacon-""4060|json-""telemetrie"
          HITS=$(git grep -n -iE "${P1}|${P2}|${P3}|${P4}|${P5}|${P6}|${P7}" || true)
          if [ -n "$HITS" ]; then
            echo "ERROR: Private data strings detected in repository:"
            echo "$HITS"
            exit 1
          fi
          OVERSIZE_GO=$(find proto apps/core-gateway agents/axon -type f -name "*.go" -exec awk 'FNR == 500 { print FILENAME }' {} +)
          if [ -n "$OVERSIZE_GO" ]; then
            echo "ERROR: Go files exceeding 500 lines detected:"
            echo "$OVERSIZE_GO"
            exit 1
          fi
          OVERSIZE=$(find apps/core-web/src apps/core-gateway agents/axon -type f \( -name "*.ts" -o -name "*.tsx" -o -name "*.go" \) -exec awk 'FNR == 600 { print FILENAME }' {} +)
          if [ -n "$OVERSIZE" ]; then
            echo "ERROR: Code files exceeding 600 lines detected:"
            echo "$OVERSIZE"
            exit 1
          fi
          echo "Clean Repo Hygiene & < 500 Go / < 600 TS Line Modularization Gate passed."

      - name: Set up Go 1.23
        uses: actions/setup-go@v7
        with:
          go-version: "1.23"
          cache-dependency-path: |
            agents/axon/go.sum
            apps/core-gateway/go.sum

      - name: Run Unit Tests with Race Detector & >= 70% Coverage Gate
        run: |
          OUT=$(go test -race -cover ./proto/... ./agents/axon/... ./apps/core-gateway/...)
          echo "$OUT"
          LOW_COV=$(echo "$OUT" | awk '{for(i=1;i<=NF;i++) if($i=="coverage:") {val=$(i+1); gsub(/%/,"",val); if(val+0 < 70.0) print $2, val"%"}}')
          if [ -n "$LOW_COV" ]; then
            echo "ERROR: Go packages below 70% minimum statement coverage gate:"
            echo "$LOW_COV"
            exit 1
          fi
          echo "All 11 Go packages passed the >= 70% statement coverage gate."

      - name: Build Static Single-Binary Axon Agent (linux/amd64 & linux/arm64)
        env:
          CGO_ENABLED: "0"
        run: |
          mkdir -p dist
          GOOS=linux GOARCH=amd64 go build -C agents/axon -ldflags="-s -w" -o ../../dist/axon-linux-amd64 ./cmd/axon
          GOOS=linux GOARCH=arm64 go build -C agents/axon -ldflags="-s -w" -o ../../dist/axon-linux-arm64 ./cmd/axon
          GOOS=linux GOARCH=amd64 go build -C apps/core-gateway -ldflags="-s -w" -o ../../dist/core-gateway-linux-amd64 .

      - name: Upload Axon Artifacts
        uses: actions/upload-artifact@v7
        with:
          name: synapse-binaries
          path: dist/

  build-core-web:
    name: Build Next.js 15 Core WebUI & Brain Vault
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7

      - name: Set up Node.js 24
        uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: "npm"
          cache-dependency-path: apps/core-web/package-lock.json

      - name: Install Dependencies, Verify Strict TypeScript, Run Unit Tests & Build Next.js 15 App Router
        working-directory: apps/core-web
        run: |
          npm ci
          npx tsc --noEmit
          npm test
          npm run build

  publish-ghcr-images:
    name: Build & Publish Docker Images to GHCR (synapse-core)
    runs-on: ubuntu-24.04
    needs: [build-and-test-go, build-core-web]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7

      - name: Log in to GitHub Container Registry (GHCR)
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build & Push synapse-core-gateway Image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: apps/core-gateway/Dockerfile
          push: true
          tags: |
            ghcr.io/solidstatenetwork/synapse-core-gateway:latest
            ghcr.io/solidstatenetwork/synapse-core-gateway:${{ github.sha }}

      - name: Build & Push synapse-core-web Image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: apps/core-web/Dockerfile
          push: true
          tags: |
            ghcr.io/solidstatenetwork/synapse-core-web:latest
            ghcr.io/solidstatenetwork/synapse-core-web:${{ github.sha }}
