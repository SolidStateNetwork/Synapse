name: Synapse CI & Release Verification

on:
  push:
    branches: ["main"]
    tags: ["v*"]
  pull_request:
    branches: ["main"]

permissions:
  contents: write

jobs:
  verify:
    name: Go (core-gateway + axon) & Next.js (core-web + mcp-server) Verification
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Go 1.24
        uses: actions/setup-go@v5
        with:
          go-version: "1.24"

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: apps/core-web/package-lock.json

      - name: Verify Zero-Secret & Clean-Room Guardrails
        run: |
          if grep -rnE "BEGIN (RSA|EC|OPENSSH|PRIVATE) KEY|MTI-[A-Za-z0-9_-]{20,}|ghp_[A-Za-z0-9]{20,}|sk-[A-Za-z0-9]{20,}|10\.[2]0\.20\.[0-9]+|10\.1[0]\.[12]\.[0-9]+|\.[s]sn\b|\bvp[s][12]\b|217\.1[56][04]\.[0-9]+\.[0-9]+" \
            --exclude-dir=.git --exclude-dir=node_modules --exclude-dir=.next \
            --exclude="pre-commit" --exclude="ci.yml" --exclude="01-mtls-and-security-guardrails.md" --exclude="lexiconGovernance.ts" --exclude="synapse.test.ts" --exclude="v240-security.test.ts" .; then
            echo "::error::Secret or private infrastructure leak detected in repository!"
            exit 1
          fi

      - name: Enforce File Size Guardrails (Go < 500 lines, TS/TSX < 600 lines)
        run: |
          GO_OVER=$(find proto apps/core-gateway agents/axon -name '*.go' -exec awk 'FNR == 500 { print FILENAME }' {} +)
          if [ -n "$GO_OVER" ]; then
            echo "::error::Go files exceeding 500 lines: $GO_OVER"
            exit 1
          fi
          TS_OVER=$(find apps/core-web/src -name '*.ts' -o -name '*.tsx' | xargs awk 'FNR == 600 { print FILENAME }')
          if [ -n "$TS_OVER" ]; then
            echo "::error::TypeScript files exceeding 600 lines: $TS_OVER"
            exit 1
          fi

      - name: Build & Vet Go Binaries (`core-gateway` & `axon`)
        run: |
          mkdir -p bin
          go vet -C proto ./...
          go vet -C apps/core-gateway ./...
          go vet -C agents/axon ./...
          CGO_ENABLED=0 go build -C apps/core-gateway -ldflags="-s -w" -o ../../bin/core-gateway .
          CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go build -C agents/axon -ldflags="-s -w -X main.version=v2.5.0" -o ../../bin/axon-linux-amd64 ./cmd/axon
          CGO_ENABLED=0 GOOS=linux GOARCH=arm64 go build -C agents/axon -ldflags="-s -w -X main.version=v2.5.0" -o ../../bin/axon-linux-arm64 ./cmd/axon

      - name: Run Go Unit Tests & Enforce >= 90% Statement Coverage Across All 11 Packages
        run: |
          FAILED=0
          for mod in proto apps/core-gateway agents/axon; do
            echo "=== Module: $mod ==="
            for pkg in $(go list -C "$mod" ./...); do
              out=$(go test -C "$mod" -race -cover "$pkg")
              echo "$out"
              cov=$(echo "$out" | grep -oE '[0-9]+\.[0-9]+%' | head -1 | tr -d '%')
              if [ -z "$cov" ]; then
                echo "::error::Missing coverage output for $pkg"
                FAILED=1
              else
                awk -v c="$cov" -v p="$pkg" 'BEGIN { if (c + 0.0 < 90.0) { printf "::error::Package %s coverage %.1f%% is below 90.0%%\n", p, c; exit 1 } }' || FAILED=1
              fi
            done
          done
          exit $FAILED

      - name: Install Core-Web Dependencies & Audit Supply Chain
        working-directory: apps/core-web
        run: |
          npm ci
          npm audit --audit-level=high

      - name: Verify Standalone MCP Server Package (`packages/mcp-server`)
        run: |
          node --check packages/mcp-server/index.mjs

      - name: TypeScript Strict Typecheck (`tsc --noEmit`)
        working-directory: apps/core-web
        run: npx tsc --noEmit

      - name: Run Core-Web & MCP Server Unit & Fault-Injection Tests
        working-directory: apps/core-web
        run: |
          node --no-warnings=MODULE_TYPELESS_PACKAGE_JSON \
            --import ./src/__tests__/register-hooks.mjs \
            --test \
            src/__tests__/synapse.test.ts \
            src/__tests__/fault-injection.test.ts \
            src/__tests__/api-routes.test.ts \
            src/__tests__/core-deep.test.ts \
            src/__tests__/llm-and-ota.test.ts \
            src/__tests__/v240-security.test.ts \
            src/__tests__/v250-enterprise.test.ts

      - name: Build Production Next.js Bundle & Generate Supply-Chain SBOM
        working-directory: apps/core-web
        env:
          NEXT_TELEMETRY_DISABLED: "1"
        run: |
          npm run build
          npm sbom --sbom-format cyclonedx > sbom-core-web.cdx.json

  release-binaries:
    name: Build & Publish Multi-Arch Binaries on Tag
    needs: verify
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Go 1.24
        uses: actions/setup-go@v5
        with:
          go-version: "1.24"

      - name: Build Static Release Binaries & Checksums
        run: |
          VERSION="${GITHUB_REF_NAME}"
          COMMIT="${GITHUB_SHA::7}"
          mkdir -p dist
          CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go build -C apps/core-gateway -ldflags="-s -w" -o ../../dist/core-gateway-linux-amd64 .
          CGO_ENABLED=0 GOOS=linux GOARCH=arm64 go build -C apps/core-gateway -ldflags="-s -w" -o ../../dist/core-gateway-linux-arm64 .
          CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go build -C agents/axon -ldflags="-s -w -X main.version=${VERSION} -X main.commit=${COMMIT}" -o ../../dist/axon-linux-amd64 ./cmd/axon
          CGO_ENABLED=0 GOOS=linux GOARCH=arm64 go build -C agents/axon -ldflags="-s -w -X main.version=${VERSION} -X main.commit=${COMMIT}" -o ../../dist/axon-linux-arm64 ./cmd/axon
          cd dist && sha256sum * > SHA256SUMS.txt

      - name: Publish GitHub Release Assets
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/core-gateway-linux-amd64
            dist/core-gateway-linux-arm64
            dist/axon-linux-amd64
            dist/axon-linux-arm64
            dist/SHA256SUMS.txt
