<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 370" width="100%" height="100%">
  <defs>
    <pattern id="dot-grid" width="22" height="22" patternUnits="userSpaceOnUse">
      <circle cx="11" cy="11" r="1.25" fill="#2e3238" />
    </pattern>
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#16181b" />
      <stop offset="50%" stop-color="#181a1d" />
      <stop offset="100%" stop-color="#141619" />
    </linearGradient>
    <linearGradient id="accent-glow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#f68330" stop-opacity="0.12" />
      <stop offset="50%" stop-color="#f68330" stop-opacity="0.03" />
      <stop offset="100%" stop-color="#31c48d" stop-opacity="0.12" />
    </linearGradient>
    <style>
      @keyframes dash-flow {
        from { stroke-dashoffset: 24; }
        to { stroke-dashoffset: 0; }
      }
      @keyframes pulse-dot {
        0%, 100% { opacity: 1; r: 4; }
        50% { opacity: 0.45; r: 6; }
      }
      .anim-edge {
        stroke-dasharray: 6 6;
        animation: dash-flow 0.9s linear infinite;
      }
      .pulse {
        animation: pulse-dot 2s ease-in-out infinite;
      }
      .font-sans {
        font-family: -apple-system, BlinkMacSystemFont, "Inter", "Segoe UI", Roboto, sans-serif;
      }
      .font-mono {
        font-family: ui-monospace, SFMono-Regular, "JetBrains Mono", Menlo, monospace;
      }
    </style>
  </defs>

  <!-- Outer Frame -->
  <rect width="1200" height="370" rx="16" fill="url(#bg-grad)" stroke="#292d33" stroke-width="1.5" />
  <rect width="1200" height="370" rx="16" fill="url(#dot-grid)" />
  <rect width="1200" height="370" rx="16" fill="url(#accent-glow)" />

  <!-- ═══════════════════════════════════════════════════════════════════════
       TOP SECTION: BRAND HEADER & TAGLINE (y = 28..165, zero overlap)
  ═══════════════════════════════════════════════════════════════════════ -->
  <g transform="translate(48, 32)">
    <!-- Logo Icon -->
    <rect x="0" y="0" width="56" height="56" rx="13" fill="#f68330" />
    <path d="M 16 39 L 28 15 L 40 39 Z" fill="none" stroke="#ffffff" stroke-width="3" stroke-linejoin="round" />
    <circle cx="28" cy="30" r="3.5" fill="#ffffff" />

    <!-- Brand Name + Version Badge -->
    <text x="72" y="40" fill="#ffffff" font-size="40" font-weight="700" letter-spacing="-0.8" class="font-sans">Synapse</text>
    <rect x="246" y="15" width="66" height="24" rx="6" fill="#341b09" stroke="#f68330" stroke-width="1" />
    <text x="259" y="31" fill="#f68330" font-size="11.5" font-weight="600" class="font-mono">v0.2.0</text>

    <!-- Right-Aligned Status Pill -->
    <rect x="780" y="12" width="324" height="30" rx="15" fill="#1d2024" stroke="#2e3238" stroke-width="1" />
    <circle cx="798" cy="27" r="4" fill="#31c48d" class="pulse" />
    <text x="812" y="31" fill="#ffffff" font-size="11" font-weight="600" class="font-sans">CONTROL CENTER</text>
    <text x="920" y="31" fill="#5e6570" font-size="11" class="font-sans">|</text>
    <text x="932" y="31" fill="#f68330" font-size="11" font-weight="500" class="font-mono">mTLS 1.3 + Yamux</text>

    <!-- Main Headline & Subtitle -->
    <text x="0" y="86" fill="#ffffff" font-size="19" font-weight="600" class="font-sans">
      Self-Hosted "Brain &amp; Muscle" AI DevOps &amp; Autonomous Engineering Platform
    </text>
    <text x="0" y="112" fill="#9ca3af" font-size="13.5" class="font-sans">
      Stateless Cognitive Control Plane (synapse-core) orchestrating Stateful Remote Linux Nodes (axon) over a single outbound mTLS tunnel.
    </text>
  </g>

  <!-- Divider Line -->
  <line x1="48" y1="168" x2="1152" y2="168" stroke="#25282d" stroke-width="1" />

  <!-- ═══════════════════════════════════════════════════════════════════════
       BOTTOM SECTION: LOGICAL END-TO-END FLOW (Muscle Peer -> Policies -> Brain)
       Left (x=48..368)  ==>  Center (x=450..750)  ==>  Right (x=832..1152)
  ═══════════════════════════════════════════════════════════════════════ -->

  <!-- Animated Connector Edges: Left Peer (x=368) -> Center Policies (x=460) -->
  <path d="M 368 264 C 410 264, 415 216, 460 216" fill="none" stroke="#f68330" stroke-width="2" class="anim-edge" />
  <path d="M 368 264 C 410 264, 415 264, 460 264" fill="none" stroke="#31c48d" stroke-width="2" class="anim-edge" />
  <path d="M 368 264 C 410 264, 415 312, 460 312" fill="none" stroke="#38bdf8" stroke-width="2" class="anim-edge" />

  <!-- Animated Connector Edges: Center Policies (x=740) -> Right Brain Control Plane (x=832) -->
  <path d="M 740 216 C 785 216, 790 228, 832 228" fill="none" stroke="#f68330" stroke-width="2" class="anim-edge" />
  <path d="M 740 264 C 785 264, 790 264, 832 264" fill="none" stroke="#31c48d" stroke-width="2" class="anim-edge" />
  <path d="M 740 312 C 785 312, 790 300, 832 300" fill="none" stroke="#38bdf8" stroke-width="2" class="anim-edge" />

  <!-- 1. LEFT CARD: THE MUSCLE PEER (`axon`) -->
  <g transform="translate(48, 194)">
    <rect x="0" y="0" width="320" height="140" rx="12" fill="#1d2024" stroke="#f68330" stroke-width="1.5" />
    <text x="16" y="22" fill="#9ca3af" font-size="9.5" font-weight="600" class="font-mono">THE MUSCLE · STATEFUL GO AGENT</text>
    <text x="262" y="22" fill="#31c48d" font-size="9.5" font-weight="600" class="font-mono">ONLINE</text>
    <line x1="14" y1="30" x2="306" y2="30" stroke="#292d33" />

    <circle cx="22" cy="50" r="4" fill="#31c48d" />
    <text x="34" y="54" fill="#ffffff" font-size="14" font-weight="700" class="font-mono">node-cachyos-01 (axon)</text>
    <text x="16" y="74" fill="#9ca3af" font-size="11" class="font-mono">Persistent PTY · Atomic FS · 127.0.0.1 Proxy</text>

    <rect x="16" y="88" width="288" height="36" rx="6" fill="#16181b" stroke="#292d33" />
    <text x="28" y="110" fill="#9ca3af" font-size="10.5" class="font-mono">CPU <tspan fill="#ffffff">4.2%</tspan>   RAM <tspan fill="#ffffff">18.9%</tspan>   DSK <tspan fill="#ffffff">11.1%</tspan></text>

    <!-- Right Handle Dot -->
    <circle cx="320" cy="70" r="4" fill="#181a1d" stroke="#f68330" stroke-width="2" />
  </g>

  <!-- 2. CENTER COLUMN: mTLS TUNNEL & AUTONOMY POLICIES -->
  <!-- Pill 1: Autonomy Tier -->
  <g transform="translate(460, 198)">
    <rect x="0" y="0" width="280" height="36" rx="18" fill="#1d2024" stroke="#f68330" stroke-width="1.2" />
    <circle cx="0" cy="18" r="3.5" fill="#181a1d" stroke="#f68330" stroke-width="1.8" />
    <circle cx="18" cy="18" r="4" fill="#f68330" />
    <text x="32" y="22" fill="#ffffff" font-size="11" font-weight="600" class="font-mono">TIER_2_WORKSPACE_JAIL</text>
    <text x="224" y="22" fill="#f68330" font-size="9.5" font-weight="600" class="font-mono">SANDBOX</text>
    <circle cx="280" cy="18" r="3.5" fill="#181a1d" stroke="#f68330" stroke-width="1.8" />
  </g>

  <!-- Pill 2: Rule Cartridges -->
  <g transform="translate(460, 246)">
    <rect x="0" y="0" width="280" height="36" rx="18" fill="#1d2024" stroke="#31c48d" stroke-width="1.2" />
    <circle cx="0" cy="18" r="3.5" fill="#181a1d" stroke="#31c48d" stroke-width="1.8" />
    <circle cx="18" cy="18" r="4" fill="#31c48d" />
    <text x="32" y="22" fill="#ffffff" font-size="11" font-weight="600" class="font-mono">Docker-First &amp; Zero-Trust</text>
    <text x="234" y="22" fill="#31c48d" font-size="9.5" font-weight="600" class="font-mono">ACTIVE</text>
    <circle cx="280" cy="18" r="3.5" fill="#181a1d" stroke="#31c48d" stroke-width="1.8" />
  </g>

  <!-- Pill 3: Deterministic Guardrails -->
  <g transform="translate(460, 294)">
    <rect x="0" y="0" width="280" height="36" rx="18" fill="#1d2024" stroke="#38bdf8" stroke-width="1.2" />
    <circle cx="0" cy="18" r="3.5" fill="#181a1d" stroke="#38bdf8" stroke-width="1.8" />
    <circle cx="18" cy="18" r="4" fill="#38bdf8" />
    <text x="32" y="22" fill="#ffffff" font-size="11" font-weight="600" class="font-mono">Self-Lockout &amp; Secret Guard</text>
    <text x="226" y="22" fill="#38bdf8" font-size="9.5" font-weight="600" class="font-mono">ENFORCED</text>
    <circle cx="280" cy="18" r="3.5" fill="#181a1d" stroke="#38bdf8" stroke-width="1.8" />
  </g>

  <!-- 3. RIGHT CARD: THE BRAIN CONTROL PLANE (`synapse-core`) -->
  <g transform="translate(832, 194)">
    <rect x="0" y="0" width="320" height="140" rx="12" fill="#1d2024" stroke="#31c48d" stroke-width="1.5" />
    <text x="16" y="22" fill="#31c48d" font-size="9.5" font-weight="600" class="font-mono">THE BRAIN · STATELESS CONTROL PLANE</text>
    <line x1="14" y1="30" x2="306" y2="30" stroke="#292d33" />

    <text x="16" y="54" fill="#ffffff" font-size="14" font-weight="700" class="font-sans">synapse-core (Brain Vault &amp; AI)</text>
    <text x="16" y="74" fill="#9ca3af" font-size="11" class="font-mono">ReAct Orchestrator · Architecture.md</text>

    <rect x="16" y="88" width="288" height="36" rx="6" fill="#16181b" stroke="#292d33" />
    <text x="28" y="110" fill="#e4e7e9" font-size="10.5" class="font-mono">Secrets.enc (<tspan fill="#31c48d">AES-256-GCM</tspan>) · Audit.jsonl</text>

    <!-- Left Handle Dots -->
    <circle cx="0" cy="34" r="4" fill="#181a1d" stroke="#f68330" stroke-width="2" />
    <circle cx="0" cy="70" r="4" fill="#181a1d" stroke="#31c48d" stroke-width="2" />
    <circle cx="0" cy="106" r="4" fill="#181a1d" stroke="#38bdf8" stroke-width="2" />
  </g>
</svg>
