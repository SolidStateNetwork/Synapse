    <circle cx="-112" cy="18" r="3.5" fill="#f68330" />
    <text x="-100" y="22" fill="#ffffff" font-size="10.5" font-weight="600" class="font-mono">TIER_2_JAIL</text>
    <circle cx="10" cy="18" r="3.5" fill="#181a1d" stroke="#f68330" stroke-width="1.8" />
  </g>

  <g transform="translate(650, 152)">
    <rect x="-130" y="0" width="140" height="36" rx="18" fill="#1d2024" stroke="#31c48d" stroke-width="1.2" />
    <circle cx="-112" cy="18" r="3.5" fill="#31c48d" />
    <text x="-100" y="22" fill="#ffffff" font-size="10.5" font-weight="600" class="font-mono">Docker-First</text>
    <circle cx="10" cy="18" r="3.5" fill="#181a1d" stroke="#31c48d" stroke-width="1.8" />
  </g>

  <g transform="translate(650, 228)">
    <rect x="-130" y="0" width="140" height="36" rx="18" fill="#1d2024" stroke="#38bdf8" stroke-width="1.2" />
    <circle cx="-112" cy="18" r="3.5" fill="#38bdf8" />
    <text x="-100" y="22" fill="#ffffff" font-size="10.5" font-weight="600" class="font-mono">Self-Lockout</text>
    <circle cx="10" cy="18" r="3.5" fill="#181a1d" stroke="#38bdf8" stroke-width="1.8" />
  </g>

  <!-- Right Target Cards -->
  <g transform="translate(915, 32)">
    <rect x="0" y="0" width="235" height="68" rx="10" fill="#1d2024" stroke="#f68330" stroke-width="1.2" />
    <circle cx="0" cy="34" r="3.5" fill="#181a1d" stroke="#f68330" stroke-width="1.8" />
    <text x="16" y="24" fill="#9ca3af" font-size="9.5" font-weight="600" class="font-mono">MUSCLE PEER · ONLINE</text>
    <circle cx="16" cy="44" r="4" fill="#31c48d" />
    <text x="26" y="48" fill="#ffffff" font-size="13" font-weight="600" class="font-mono">node-cachyos-01</text>
