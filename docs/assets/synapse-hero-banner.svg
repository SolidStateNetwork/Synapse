  <!-- Animated Connector Edges: Left Servers (x=358) -> Center Core Hub (x=450) -->
  <path d="M 358 232 C 400 232, 405 268, 450 268" fill="none" stroke="#f68330" stroke-width="2" class="anim-edge" />
  <path d="M 358 312 C 400 312, 405 268, 450 268" fill="none" stroke="#f68330" stroke-width="2" class="anim-edge" />

  <!-- Animated Connector Edges: Center Core Hub (x=750) -> Right Services & AI Skills (x=842) -->
  <path d="M 750 248 C 795 248, 800 222, 842 222" fill="none" stroke="#38bdf8" stroke-width="2" class="anim-edge" />
  <path d="M 750 268 C 795 268, 800 272, 842 272" fill="none" stroke="#31c48d" stroke-width="2" class="anim-edge" />
  <path d="M 750 288 C 795 288, 800 322, 842 322" fill="none" stroke="#a855f7" stroke-width="2" class="anim-edge" />

