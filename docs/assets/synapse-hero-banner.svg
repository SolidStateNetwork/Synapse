    <text x="0" y="136" fill="#e4e7e9" font-size="18" font-weight="600" class="font-sans">
      The "Brain &amp; Muscle" Self-Hosted AI DevOps &amp; Autonomous Engineering Platform
    </text>
    <text x="0" y="164" fill="#9ca3af" font-size="13.5" class="font-sans">
