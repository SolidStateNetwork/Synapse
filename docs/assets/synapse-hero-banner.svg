    <rect x="154" y="78" width="130" height="24" rx="6" fill="#082f49" stroke="#38bdf8" stroke-width="0.8" />
    <text x="164" y="94" fill="#38bdf8" font-size="10" font-weight="600" class="font-mono">⚡ Prompt Cache</text>

    <text x="16" y="122" fill="#9ca3af" font-size="10.5" class="font-mono">Architecture.md · Memory.md · Secrets.enc</text>

    <circle cx="0" cy="68" r="4" fill="#181a1d" stroke="#f68330" stroke-width="2" />
    <circle cx="300" cy="48" r="4" fill="#181a1d" stroke="#38bdf8" stroke-width="2" />
    <circle cx="300" cy="68" r="4" fill="#181a1d" stroke="#31c48d" stroke-width="2" />
    <circle cx="300" cy="88" r="4" fill="#181a1d" stroke="#a855f7" stroke-width="2" />
  </g>

  <!-- 3. RIGHT COLUMN: INTERACTIVE AI SKILLS, SERVICES & INTERVIEW MODE -->
  <g transform="translate(842, 198)">
    <rect x="0" y="0" width="310" height="44" rx="10" fill="#1d2024" stroke="#38bdf8" stroke-width="1.2" />
    <circle cx="0" cy="22" r="3.5" fill="#181a1d" stroke="#38bdf8" stroke-width="1.8" />
    <circle cx="18" cy="22" r="4" fill="#38bdf8" />
    <text x="32" y="26" fill="#ffffff" font-size="11.5" font-weight="600" class="font-sans">Live Service &amp; SQLite Proxy</text>
    <text x="232" y="26" fill="#38bdf8" font-size="10" font-weight="600" class="font-mono">ZERO-PORT</text>
  </g>

  <g transform="translate(842, 250)">
    <rect x="0" y="0" width="310" height="44" rx="10" fill="#1d2024" stroke="#31c48d" stroke-width="1.2" />
    <circle cx="0" cy="22" r="3.5" fill="#181a1d" stroke="#31c48d" stroke-width="1.8" />
    <circle cx="18" cy="22" r="4" fill="#31c48d" />
    <text x="32" y="26" fill="#ffffff" font-size="11.5" font-weight="600" class="font-sans">1-Click DevOps Skills &amp; Audits</text>
    <text x="236" y="26" fill="#31c48d" font-size="10" font-weight="600" class="font-mono">4 SKILLS</text>
  </g>

  <g transform="translate(842, 302)">
    <rect x="0" y="0" width="310" height="44" rx="10" fill="#1d2024" stroke="#a855f7" stroke-width="1.2" />
    <circle cx="0" cy="22" r="3.5" fill="#181a1d" stroke="#a855f7" stroke-width="1.8" />
    <circle cx="18" cy="22" r="4" fill="#c084fc" />
    <text x="32" y="26" fill="#ffffff" font-size="11.5" font-weight="600" class="font-sans">Step-by-Step Interview Mode</text>
    <text x="230" y="26" fill="#c084fc" font-size="10" font-weight="600" class="font-mono">APPROVAL</text>
