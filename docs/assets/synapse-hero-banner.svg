      <circle cx="16" cy="16" r="3.5" fill="#f68330" />
      <text x="28" y="20" fill="#e4e7e9" font-size="11.5" font-weight="500" class="font-mono">Zero-Firewall mTLS</text>

      <rect x="180" y="0" width="176" height="32" rx="8" fill="#1d2024" stroke="#2e3238" />
      <circle cx="196" cy="16" r="3.5" fill="#31c48d" />
      <text x="208" y="20" fill="#e4e7e9" font-size="11.5" font-weight="500" class="font-mono">AES-256-GCM Vault</text>

      <rect x="368" y="0" width="178" height="32" rx="8" fill="#1d2024" stroke="#2e3238" />
      <circle cx="384" cy="16" r="3.5" fill="#38bdf8" />
      <text x="396" y="20" fill="#e4e7e9" font-size="11.5" font-weight="500" class="font-mono">3 Autonomy Tiers</text>
    </g>
