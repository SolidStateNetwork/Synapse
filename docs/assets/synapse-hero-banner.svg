    <circle cx="0" cy="34" r="3.5" fill="#181a1d" stroke="#31c48d" stroke-width="1.8" />
    <text x="16" y="24" fill="#31c48d" font-size="9.5" font-weight="600" class="font-mono">BRAIN VAULT · AES-256-GCM</text>
    <text x="16" y="48" fill="#ffffff" font-size="12.5" font-weight="600" class="font-sans">Architecture.md &amp; Secrets</text>
  </g>

  <g transform="translate(915, 240)">
    <rect x="0" y="0" width="235" height="68" rx="10" fill="#1d2024" stroke="#2e3238" stroke-width="1.2" />
    <circle cx="0" cy="34" r="3.5" fill="#181a1d" stroke="#38bdf8" stroke-width="1.8" />
    <text x="16" y="24" fill="#38bdf8" font-size="9.5" font-weight="600" class="font-mono">YAMUX STREAM 3 · TUNNEL</text>
    <text x="16" y="48" fill="#ffffff" font-size="12.5" font-weight="600" class="font-mono">127.0.0.1:4050 → :8081</text>
