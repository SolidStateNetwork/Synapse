<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 380" width="100%" height="100%">
  <defs>
    <pattern id="dot-grid" width="22" height="22" patternUnits="userSpaceOnUse">
      <circle cx="11" cy="11" r="1.25" fill="#2e3238" />
    </pattern>
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#16181b" />
      <stop offset="50%" stop-color="#181a1d" />
      <stop offset="100%" stop-color="#141619" />
    </linearGradient>
    <linearGradient id="accent-glow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#f68330" stop-opacity="0.14" />
      <stop offset="50%" stop-color="#38bdf8" stop-opacity="0.05" />
      <stop offset="100%" stop-color="#31c48d" stop-opacity="0.14" />
    </linearGradient>
    <style>
      @keyframes dash-flow {
        from { stroke-dashoffset: 24; }
        to { stroke-dashoffset: 0; }
      }
      @keyframes pulse-dot {
        0%, 100% { opacity: 1; r: 4; }
        50% { opacity: 0.45; r: 6; }
      }
      .anim-edge {
        stroke-dasharray: 6 6;
        animation: dash-flow 0.9s linear infinite;
      }
      .pulse {
        animation: pulse-dot 2s ease-in-out infinite;
      }
      .font-sans {
        font-family: -apple-system, BlinkMacSystemFont, "Inter", "Segoe UI", Roboto, sans-serif;
      }
      .font-mono {
        font-family: ui-monospace, SFMono-Regular, "JetBrains Mono", Menlo, monospace;
      }
    </style>
  </defs>

  <!-- Outer Frame -->
  <rect width="1200" height="380" rx="16" fill="url(#bg-grad)" stroke="#292d33" stroke-width="1.5" />
  <rect width="1200" height="380" rx="16" fill="url(#dot-grid)" />
  <rect width="1200" height="380" rx="16" fill="url(#accent-glow)" />

  <!-- TOP SECTION: BRAND HEADER & AI-MANAGED TAGLINE -->
  <g transform="translate(48, 30)">
    <!-- Logo Icon -->
    <rect x="0" y="0" width="56" height="56" rx="14" fill="#341b09" stroke="#f68330" stroke-width="1.5" />
    <circle cx="28" cy="18" r="4" fill="#f68330" />
    <circle cx="17" cy="37" r="4" fill="#f68330" />
    <circle cx="39" cy="37" r="4" fill="#f68330" />
    <path d="M 28 22 L 19 34 M 28 22 L 37 34 M 21 37 L 35 37" stroke="#f68330" stroke-width="2.2" />

    <!-- Brand Name + Version Badge -->
    <text x="72" y="39" fill="#ffffff" font-size="38" font-weight="700" letter-spacing="-0.8" class="font-sans">Synapse</text>
    <rect x="236" y="14" width="66" height="24" rx="6" fill="#341b09" stroke="#f68330" stroke-width="1" />
    <text x="249" y="30" fill="#f68330" font-size="11.5" font-weight="600" class="font-mono">v0.2.0</text>
    <rect x="310" y="14" width="76" height="24" rx="6" fill="#1d2024" stroke="#2e3238" stroke-width="1" />
    <text x="322" y="30" fill="#e4e7e9" font-size="10.5" font-weight="600" class="font-mono">DE | EN</text>

    <!-- Right-Aligned Status Pill -->
    <rect x="740" y="12" width="364" height="30" rx="15" fill="#1d2024" stroke="#2e3238" stroke-width="1" />
    <circle cx="758" cy="27" r="4" fill="#31c48d" class="pulse" />
    <text x="772" y="31" fill="#ffffff" font-size="11" font-weight="600" class="font-sans">AI-MANAGED CONTROL CENTER</text>
    <text x="954" y="31" fill="#5e6570" font-size="11" class="font-sans">|</text>
    <text x="966" y="31" fill="#f68330" font-size="11" font-weight="600" class="font-mono">mTLS 1.3 + Yamux</text>

    <!-- Main Headline & Subtitle -->
    <text x="0" y="86" fill="#ffffff" font-size="19.5" font-weight="600" class="font-sans">
      Your AI-Managed Linux Server &amp; DevOps Control Center
    </text>
    <text x="0" y="112" fill="#9ca3af" font-size="13.5" class="font-sans">
      Inspect, deploy, secure, and repair your Linux servers alongside an interactive AI system administrator — with full visual control.
    </text>
