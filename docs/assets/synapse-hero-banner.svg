<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 340" width="100%" height="100%">
  <defs>
    <pattern id="dot-grid" width="22" height="22" patternUnits="userSpaceOnUse">
      <circle cx="11" cy="11" r="1.25" fill="#2e3238" />
    </pattern>
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#16181b" />
      <stop offset="50%" stop-color="#181a1d" />
      <stop offset="100%" stop-color="#141619" />
    </linearGradient>
    <linearGradient id="orange-glow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#f68330" stop-opacity="0.18" />
      <stop offset="50%" stop-color="#f68330" stop-opacity="0.04" />
      <stop offset="100%" stop-color="#31c48d" stop-opacity="0.14" />
    </linearGradient>
    <style>
      @keyframes dash-flow {
        from { stroke-dashoffset: 24; }
        to { stroke-dashoffset: 0; }
      }
      @keyframes pulse-dot {
        0%, 100% { opacity: 1; r: 4; }
        50% { opacity: 0.45; r: 6.5; }
      }
      .anim-edge {
        stroke-dasharray: 6 6;
        animation: dash-flow 0.9s linear infinite;
      }
      .pulse {
        animation: pulse-dot 2s ease-in-out infinite;
      }
      .font-sans {
        font-family: -apple-system, BlinkMacSystemFont, "Inter", "Segoe UI", Roboto, sans-serif;
      }
      .font-mono {
        font-family: ui-monospace, SFMono-Regular, "JetBrains Mono", Menlo, monospace;
      }
    </style>
  </defs>

  <!-- Outer Frame -->
  <rect width="1200" height="340" rx="16" fill="url(#bg-grad)" stroke="#292d33" stroke-width="1.5" />
  <rect width="1200" height="340" rx="16" fill="url(#dot-grid)" />
  <rect width="1200" height="340" rx="16" fill="url(#orange-glow)" />

  <!-- Decorative Background Bezier Streams -->
  <path d="M 640 95 C 770 95, 790 65, 915 65" fill="none" stroke="#f68330" stroke-width="2" class="anim-edge" opacity="0.85" />
  <path d="M 640 170 C 770 170, 790 170, 915 170" fill="none" stroke="#31c48d" stroke-width="2" class="anim-edge" opacity="0.85" />
  <path d="M 640 245 C 770 245, 790 275, 915 275" fill="none" stroke="#38bdf8" stroke-width="2" class="anim-edge" opacity="0.85" />

  <!-- Left Brand & Value Proposition -->
  <g transform="translate(52, 46)">
