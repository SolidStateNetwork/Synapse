    <rect x="0" y="0" width="328" height="28" rx="14" fill="#1d2024" stroke="#2e3238" stroke-width="1" />
    <circle cx="16" cy="14" r="4" fill="#31c48d" class="pulse" />
    <text x="28" y="18" fill="#ffffff" font-size="11" font-weight="600" class="font-sans">CONTROL CENTER UI</text>
    <text x="148" y="18" fill="#5e6570" font-size="11" class="font-sans">|</text>
    <text x="160" y="18" fill="#f68330" font-size="11" font-weight="500" class="font-mono">mTLS 1.3 + Yamux</text>

    <!-- Logo Icon + Title -->
    <g transform="translate(0, 48)">
      <rect x="0" y="0" width="54" height="54" rx="12" fill="#f68330" />
      <path d="M 15 38 L 27 14 L 39 38 Z" fill="none" stroke="#ffffff" stroke-width="3" stroke-linejoin="round" />
      <circle cx="27" cy="29" r="3.5" fill="#ffffff" />
      <text x="70" y="38" fill="#ffffff" font-size="42" font-weight="700" letter-spacing="-0.8" class="font-sans">Synapse</text>
      <rect x="250" y="14" width="66" height="22" rx="6" fill="#341b09" stroke="#f68330" stroke-width="1" />
      <text x="263" y="29" fill="#f68330" font-size="11" font-weight="600" class="font-mono">v0.2.0</text>
