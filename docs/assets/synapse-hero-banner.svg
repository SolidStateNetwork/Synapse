    <rect x="14" y="18" width="34" height="34" rx="8" fill="#16181b" stroke="#292d33" />
    <circle cx="62" cy="27" r="3.5" fill="#31c48d" />
    <text x="72" y="31" fill="#ffffff" font-size="13" font-weight="700" class="font-mono">vps2-muscle</text>
    <text x="58" y="49" fill="#9ca3af" font-size="10.5" class="font-mono">217.154.20.24 · Tier 1 · CPU 0.5%</text>
    <circle cx="310" cy="38" r="4" fill="#181a1d" stroke="#f68330" stroke-width="2" />
  </g>

  <g transform="translate(48, 276)">
    <rect x="0" y="0" width="310" height="72" rx="12" fill="#1d2024" stroke="#2e3238" stroke-width="1.5" />
    <rect x="14" y="18" width="34" height="34" rx="8" fill="#16181b" stroke="#292d33" />
    <circle cx="62" cy="27" r="3.5" fill="#31c48d" />
    <text x="72" y="31" fill="#ffffff" font-size="13" font-weight="700" class="font-mono">vps2-db-node</text>
    <text x="58" y="49" fill="#9ca3af" font-size="10.5" class="font-mono">217.154.20.24 · Tier 2 Sandbox</text>
    <circle cx="310" cy="36" r="4" fill="#181a1d" stroke="#f68330" stroke-width="2" />
  </g>

  <!-- 2. CENTER CARD: SYNAPSE CORE HUB (BRAIN VAULT + AI ORCHESTRATOR) -->
  <g transform="translate(450, 200)">
    <rect x="0" y="0" width="300" height="140" rx="14" fill="#1d2024" stroke="#f68330" stroke-width="1.5" />
    <rect x="16" y="16" width="38" height="38" rx="10" fill="#341b09" stroke="#f68330" stroke-width="1" />
    <circle cx="35" cy="35" r="6" fill="#f68330" />
    <text x="66" y="31" fill="#ffffff" font-size="14" font-weight="700" class="font-sans">Synapse Core Hub</text>
