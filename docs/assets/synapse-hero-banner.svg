<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 360" width="100%" height="100%">
  <defs>
    <pattern id="dot-grid" width="24" height="24" patternUnits="userSpaceOnUse">
      <circle cx="12" cy="12" r="1.2" fill="#262930" />
    </pattern>
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#141619" />
      <stop offset="50%" stop-color="#181b20" />
      <stop offset="100%" stop-color="#131518" />
    </linearGradient>
    <linearGradient id="card-grad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#20242a" />
      <stop offset="100%" stop-color="#191c21" />
    </linearGradient>
    <style>
      @keyframes flow {
        from { stroke-dashoffset: 28; }
        to { stroke-dashoffset: 0; }
      }
      .flow-line {
        stroke-dasharray: 7 7;
        animation: flow 1.1s linear infinite;
      }
      .sans {
        font-family: -apple-system, BlinkMacSystemFont, "Inter", "Segoe UI", Roboto, sans-serif;
      }
    </style>
  </defs>

  <!-- Background Frame -->
  <rect width="1200" height="360" rx="18" fill="url(#bg-grad)" stroke="#2b3038" stroke-width="1.5" />
  <rect width="1200" height="360" rx="18" fill="url(#dot-grid)" />

  <!-- Top Brand Header -->
  <g transform="translate(52, 34)">
    <!-- Synapse Icon -->
    <rect x="0" y="0" width="54" height="54" rx="14" fill="#341b09" stroke="#f68330" stroke-width="1.5" />
    <circle cx="27" cy="17" r="4.2" fill="#f68330" />
    <circle cx="16" cy="36" r="4.2" fill="#f68330" />
    <circle cx="38" cy="36" r="4.2" fill="#f68330" />
    <path d="M 27 21 L 18 33 M 27 21 L 36 33 M 20 36 L 34 36" stroke="#f68330" stroke-width="2.2" stroke-linecap="round" />

    <!-- Brand Name & Tagline -->
    <text x="72" y="34" fill="#ffffff" font-size="34" font-weight="800" letter-spacing="-0.6" class="sans">Synapse</text>
    <text x="228" y="33" fill="#9ca3af" font-size="18" font-weight="500" class="sans">— Your AI System Administrator for Linux Servers</text>

    <!-- Simple 1-line explanation -->
    <text x="72" y="58" fill="#d1d5db" font-size="14.5" class="sans">
      Tell the AI what you need in plain language. Synapse plans the steps, checks your safety rules, and manages your servers visually.
    </text>
  </g>

  <!-- Subtle Divider -->
  <line x1="52" y1="116" x2="1148" y2="116" stroke="#262a32" stroke-width="1" />

  <!-- Flow Connectors between the 3 Steps -->
  <g>
    <!-- Connector 1 -> 2 -->
    <line x1="382" y1="228" x2="438" y2="228" stroke="#f68330" stroke-width="2.5" class="flow-line" />
    <polygon points="436,222 446,228 436,234" fill="#f68330" />

    <!-- Connector 2 -> 3 -->
    <line x1="758" y1="228" x2="814" y2="228" stroke="#31c48d" stroke-width="2.5" class="flow-line" />
    <polygon points="812,222 822,228 812,234" fill="#31c48d" />
  </g>

  <!-- STEP 1: YOU ASK IN CHAT -->
  <g transform="translate(52, 144)">
    <rect x="0" y="0" width="330" height="172" rx="16" fill="url(#card-grad)" stroke="#323842" stroke-width="1.5" />

    <!-- Step Pill -->
    <rect x="22" y="20" width="90" height="26" rx="13" fill="#1e293b" stroke="#38bdf8" stroke-width="1" />
    <text x="67" y="37" text-anchor="middle" fill="#7dd3fc" font-size="11.5" font-weight="700" class="sans">1. YOU ASK</text>

    <!-- Chat Icon -->
    <circle cx="290" cy="33" r="16" fill="#172536" stroke="#38bdf8" stroke-width="1.2" />
    <path d="M 283 28 H 297 V 36 H 288 L 283 40 Z" fill="none" stroke="#38bdf8" stroke-width="1.6" stroke-linejoin="round" />

    <!-- Headline -->
    <text x="22" y="74" fill="#ffffff" font-size="18" font-weight="700" class="sans">Chat in Plain Language</text>
    <text x="22" y="97" fill="#9ca3af" font-size="13" class="sans">No complex terminal commands needed.</text>

    <!-- Example Bubble -->
    <rect x="22" y="114" width="286" height="38" rx="10" fill="#14171b" stroke="#2b3038" />
    <text x="36" y="138" fill="#e5e7eb" font-size="13" font-weight="500" class="sans">“Check my server and deploy my website”</text>
  </g>

  <!-- STEP 2: SYNAPSE AI PLANS & PROTECTS -->
  <g transform="translate(446, 144)">
    <rect x="0" y="0" width="312" height="172" rx="16" fill="url(#card-grad)" stroke="#f68330" stroke-width="1.5" />

    <!-- Step Pill -->
    <rect x="22" y="20" width="114" height="26" rx="13" fill="#341b09" stroke="#f68330" stroke-width="1" />
    <text x="79" y="37" text-anchor="middle" fill="#fdba74" font-size="11.5" font-weight="700" class="sans">2. SYNAPSE AI</text>

    <!-- Brain / Sparkle Icon -->
    <circle cx="272" cy="33" r="16" fill="#341b09" stroke="#f68330" stroke-width="1.2" />
    <path d="M 272 24 L 274.5 30.5 L 281 33 L 274.5 35.5 L 272 42 L 269.5 35.5 L 263 33 L 269.5 30.5 Z" fill="#f68330" />

    <!-- Headline -->
    <text x="22" y="74" fill="#ffffff" font-size="18" font-weight="700" class="sans">Thinks, Plans &amp; Checks Rules</text>
    <text x="22" y="97" fill="#9ca3af" font-size="13" class="sans">Knows your project and respects your limits.</text>

    <!-- Visual Badges -->
    <rect x="22" y="114" width="130" height="38" rx="10" fill="#14171b" stroke="#2b3038" />
    <text x="87" y="138" text-anchor="middle" fill="#fdba74" font-size="12.5" font-weight="600" class="sans">🧠 Project Memory</text>

    <rect x="160" y="114" width="130" height="38" rx="10" fill="#14171b" stroke="#2b3038" />
    <text x="225" y="138" text-anchor="middle" fill="#6ee7b7" font-size="12.5" font-weight="600" class="sans">🛡️ Safety Shield</text>
  </g>

  <!-- STEP 3: YOUR SERVERS RUN IT -->
  <g transform="translate(822, 144)">
    <rect x="0" y="0" width="326" height="172" rx="16" fill="url(#card-grad)" stroke="#31c48d" stroke-width="1.5" />

    <!-- Step Pill -->
    <rect x="22" y="20" width="132" height="26" rx="13" fill="#052e16" stroke="#31c48d" stroke-width="1" />
    <text x="88" y="37" text-anchor="middle" fill="#6ee7b7" font-size="11.5" font-weight="700" class="sans">3. YOUR SERVERS</text>

    <!-- Server Check Icon -->
    <circle cx="286" cy="33" r="16" fill="#052e16" stroke="#31c48d" stroke-width="1.2" />
    <path d="M 279 33 L 284 38 L 293 28" fill="none" stroke="#31c48d" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" />

    <!-- Headline -->
    <text x="22" y="74" fill="#ffffff" font-size="18" font-weight="700" class="sans">Done Safely &amp; Visually</text>
    <text x="22" y="97" fill="#9ca3af" font-size="13" class="sans">Apps, files, and databases stay healthy.</text>

    <!-- Status Row -->
    <rect x="22" y="114" width="282" height="38" rx="10" fill="#052e16" fill-opacity="0.5" stroke="#31c48d" stroke-opacity="0.5" />
    <circle cx="42" cy="133" r="5" fill="#31c48d" />
    <text x="56" y="138" fill="#ecfdf5" font-size="13" font-weight="600" class="sans">Website, Database &amp; Server Healthy</text>
  </g>
</svg>
