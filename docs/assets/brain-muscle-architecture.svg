<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 420" width="100%" height="100%">
  <defs>
    <pattern id="arch-dots" width="24" height="24" patternUnits="userSpaceOnUse">
      <circle cx="12" cy="12" r="1.2" fill="#272b33" />
    </pattern>
    <style>
      @keyframes stream-dash {
        from { stroke-dashoffset: 28; }
        to { stroke-dashoffset: 0; }
      }
      .s-edge {
        stroke-dasharray: 7 7;
        animation: stream-dash 1.1s linear infinite;
      }
      .sans {
        font-family: -apple-system, BlinkMacSystemFont, "Inter", "Segoe UI", Roboto, sans-serif;
      }
    </style>
  </defs>

  <!-- Outer Frame -->
  <rect width="1200" height="420" rx="18" fill="#14161a" stroke="#2b3038" stroke-width="1.5" />
  <rect width="1200" height="420" rx="18" fill="url(#arch-dots)" />

  <!-- LEFT CARD: THE BRAIN (Control Center) -->
  <g transform="translate(36, 32)">
    <rect x="0" y="0" width="380" height="356" rx="16" fill="#1b1e24" stroke="#f68330" stroke-width="1.8" />

    <!-- Header Badge -->
    <rect x="22" y="20" width="122" height="28" rx="14" fill="#341b09" stroke="#f68330" stroke-width="1" />
    <text x="83" y="38" text-anchor="middle" fill="#fdba74" font-size="12" font-weight="700" class="sans">🧠 THE BRAIN</text>
    <text x="158" y="39" fill="#ffffff" font-size="16" font-weight="700" class="sans">Control Center</text>
    <text x="22" y="68" fill="#9ca3af" font-size="13" class="sans">Thinks, plans tasks, and keeps all passwords safe.</text>

    <!-- Item 1: Visual Dashboard -->
    <rect x="22" y="86" width="336" height="74" rx="12" fill="#22262e" stroke="#323842" />
    <text x="40" y="116" fill="#ffffff" font-size="14.5" font-weight="700" class="sans">🖥️  Visual Dashboard</text>
    <text x="40" y="140" fill="#9ca3af" font-size="12.5" class="sans">See all your servers, websites, and files in one place.</text>

    <!-- Item 2: Smart AI Assistant -->
    <rect x="22" y="172" width="336" height="74" rx="12" fill="#22262e" stroke="#323842" />
    <text x="40" y="202" fill="#ffffff" font-size="14.5" font-weight="700" class="sans">✨  Smart AI Assistant</text>
    <text x="40" y="226" fill="#9ca3af" font-size="12.5" class="sans">Plans the work step by step and asks for your approval.</text>

    <!-- Item 3: Safe Memory & Password Vault -->
    <rect x="22" y="258" width="336" height="76" rx="12" fill="#22262e" stroke="#31c48d" stroke-opacity="0.6" />
    <text x="40" y="288" fill="#6ee7b7" font-size="14.5" font-weight="700" class="sans">🔒  Project Memory &amp; Safe Vault</text>
    <text x="40" y="312" fill="#d1d5db" font-size="12.5" class="sans">Remembers your setup; secrets never leave the Brain.</text>
  </g>

  <!-- CENTER: SECURE ENCRYPTED TUNNEL -->
  <g transform="translate(416, 0)">
    <!-- Top Pill -->
    <rect x="64" y="48" width="240" height="34" rx="17" fill="#1e2228" stroke="#f68330" stroke-width="1.2" />
    <text x="184" y="70" text-anchor="middle" fill="#ffffff" font-size="13" font-weight="700" class="sans">🔐  Encrypted Tunnel</text>

    <!-- 3 Clean Visual Streams -->
    <!-- Stream 1: Tasks & Files -->
    <line x1="0" y1="148" x2="368" y2="148" stroke="#f68330" stroke-width="2.5" class="s-edge" />
    <circle cx="0" cy="148" r="4.5" fill="#14161a" stroke="#f68330" stroke-width="2.2" />
    <circle cx="368" cy="148" r="4.5" fill="#14161a" stroke="#f68330" stroke-width="2.2" />
    <rect x="74" y="131" width="220" height="34" rx="10" fill="#1e2228" stroke="#323842" />
    <text x="184" y="153" text-anchor="middle" fill="#fdba74" font-size="12.5" font-weight="600" class="sans">⚡ Commands &amp; File Changes</text>

    <!-- Stream 2: Live Apps & Terminal -->
    <line x1="0" y1="224" x2="368" y2="224" stroke="#38bdf8" stroke-width="2.5" class="s-edge" />
    <circle cx="0" cy="224" r="4.5" fill="#14161a" stroke="#38bdf8" stroke-width="2.2" />
    <circle cx="368" cy="224" r="4.5" fill="#14161a" stroke="#38bdf8" stroke-width="2.2" />
    <rect x="74" y="207" width="220" height="34" rx="10" fill="#1e2228" stroke="#323842" />
    <text x="184" y="229" text-anchor="middle" fill="#7dd3fc" font-size="12.5" font-weight="600" class="sans">🌐 Live Apps &amp; Terminal</text>

    <!-- Stream 3: Health & Status -->
    <line x1="0" y1="300" x2="368" y2="300" stroke="#31c48d" stroke-width="2.5" class="s-edge" />
    <circle cx="0" cy="300" r="4.5" fill="#14161a" stroke="#31c48d" stroke-width="2.2" />
    <circle cx="368" cy="300" r="4.5" fill="#14161a" stroke="#31c48d" stroke-width="2.2" />
    <rect x="74" y="283" width="220" height="34" rx="10" fill="#1e2228" stroke="#323842" />
    <text x="184" y="305" text-anchor="middle" fill="#6ee7b7" font-size="12.5" font-weight="600" class="sans">🩺 Live Health Checks</text>

    <!-- Bottom Reassurance Note -->
    <rect x="48" y="346" width="272" height="30" rx="8" fill="#052e16" fill-opacity="0.5" stroke="#10b981" stroke-opacity="0.4" />
    <text x="184" y="366" text-anchor="middle" fill="#6ee7b7" font-size="12" font-weight="600" class="sans">✓ Works Without Opening Firewall Ports</text>
  </g>

  <!-- RIGHT CARD: THE MUSCLE (Server Helper) -->
  <g transform="translate(784, 32)">
    <rect x="0" y="0" width="380" height="356" rx="16" fill="#1b1e24" stroke="#31c48d" stroke-width="1.8" />

    <!-- Header Badge -->
    <rect x="22" y="20" width="134" height="28" rx="14" fill="#052e16" stroke="#31c48d" stroke-width="1" />
    <text x="89" y="38" text-anchor="middle" fill="#6ee7b7" font-size="12" font-weight="700" class="sans">🦾 THE MUSCLE</text>
    <text x="170" y="39" fill="#ffffff" font-size="16" font-weight="700" class="sans">Your Linux Server</text>
    <text x="22" y="68" fill="#9ca3af" font-size="13" class="sans">A lightweight helper on your server that does the work.</text>

    <!-- Item 1: Runs Tasks -->
    <rect x="22" y="86" width="336" height="74" rx="12" fill="#22262e" stroke="#323842" />
    <text x="40" y="116" fill="#ffffff" font-size="14.5" font-weight="700" class="sans">🛠️  Carries Out Your Tasks</text>
    <text x="40" y="140" fill="#9ca3af" font-size="12.5" class="sans">Installs software, edits files, and restarts services.</text>

    <!-- Item 2: Built-In Safety Shield -->
    <rect x="22" y="172" width="336" height="74" rx="12" fill="#22262e" stroke="#38bdf8" stroke-opacity="0.6" />
    <text x="40" y="202" fill="#7dd3fc" font-size="14.5" font-weight="700" class="sans">🛡️  Built-In Safety Shield</text>
    <text x="40" y="226" fill="#d1d5db" font-size="12.5" class="sans">Blocks dangerous commands and prevents lockouts.</text>

    <!-- Item 3: Instant App Preview -->
    <rect x="22" y="258" width="336" height="76" rx="12" fill="#22262e" stroke="#323842" />
    <text x="40" y="288" fill="#ffffff" font-size="14.5" font-weight="700" class="sans">🚀  Private App Preview</text>
    <text x="40" y="312" fill="#9ca3af" font-size="12.5" class="sans">Open apps running on your server right in your browser.</text>
  </g>
</svg>
