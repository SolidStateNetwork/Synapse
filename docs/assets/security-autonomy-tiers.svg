<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 270" width="100%" height="100%">
  <defs>
    <pattern id="tier-dots" width="24" height="24" patternUnits="userSpaceOnUse">
      <circle cx="12" cy="12" r="1.2" fill="#272b33" />
    </pattern>
    <style>
      .sans {
        font-family: -apple-system, BlinkMacSystemFont, "Inter", "Segoe UI", Roboto, sans-serif;
      }
    </style>
  </defs>

  <!-- Outer Frame -->
  <rect width="1200" height="270" rx="18" fill="#14161a" stroke="#2b3038" stroke-width="1.5" />
  <rect width="1200" height="270" rx="18" fill="url(#tier-dots)" />

  <!-- CARD 1: ASK FIRST (Supervised) -->
  <g transform="translate(28, 26)">
    <rect x="0" y="0" width="364" height="218" rx="16" fill="#1b1e24" stroke="#31c48d" stroke-width="1.5" />

    <!-- Badge -->
    <rect x="20" y="20" width="138" height="28" rx="14" fill="#052e16" stroke="#31c48d" stroke-width="1" />
    <circle cx="38" cy="34" r="4.5" fill="#31c48d" />
    <text x="52" y="38" fill="#6ee7b7" font-size="12" font-weight="700" class="sans">ASK FIRST</text>

    <!-- Title & Plain Text -->
    <text x="20" y="76" fill="#ffffff" font-size="17" font-weight="700" class="sans">AI Asks Before Every Change</text>
    <text x="20" y="102" fill="#9ca3af" font-size="13" class="sans">The AI can inspect and plan freely, but waits</text>
    <text x="20" y="122" fill="#9ca3af" font-size="13" class="sans">for your click before changing anything.</text>

    <!-- Visual Bottom Box -->
    <rect x="20" y="144" width="324" height="54" rx="10" fill="#14161a" stroke="#2b3038" />
    <text x="36" y="176" fill="#d1d5db" font-size="12.5" font-weight="600" class="sans">You decide every time:</text>
    <rect x="182" y="157" width="76" height="28" rx="7" fill="#052e16" stroke="#31c48d" />
    <text x="220" y="175" text-anchor="middle" fill="#6ee7b7" font-size="11.5" font-weight="700" class="sans">✓ Approve</text>
    <rect x="266" y="157" width="64" height="28" rx="7" fill="#262b33" stroke="#3b424f" />
    <text x="298" y="175" text-anchor="middle" fill="#9ca3af" font-size="11.5" font-weight="600" class="sans">✕ Skip</text>
  </g>

  <!-- CARD 2: PROJECT FOLDER ONLY (Recommended) -->
  <g transform="translate(418, 26)">
    <rect x="0" y="0" width="364" height="218" rx="16" fill="#1b1e24" stroke="#f68330" stroke-width="1.8" />

    <!-- Badge -->
    <rect x="20" y="20" width="180" height="28" rx="14" fill="#341b09" stroke="#f68330" stroke-width="1" />
    <circle cx="38" cy="34" r="4.5" fill="#f68330" />
    <text x="52" y="38" fill="#fdba74" font-size="12" font-weight="700" class="sans">PROJECT FOLDER ONLY</text>

    <rect x="244" y="22" width="100" height="24" rx="12" fill="#052e16" stroke="#31c48d" stroke-width="0.9" />
    <text x="294" y="38" text-anchor="middle" fill="#6ee7b7" font-size="10.5" font-weight="700" class="sans">RECOMMENDED</text>

    <!-- Title & Plain Text -->
    <text x="20" y="76" fill="#ffffff" font-size="17" font-weight="700" class="sans">AI Stays in Its Own Folder</text>
    <text x="20" y="102" fill="#9ca3af" font-size="13" class="sans">The AI works freely inside your project folder,</text>
    <text x="20" y="122" fill="#9ca3af" font-size="13" class="sans">while the rest of the server stays untouched.</text>

    <!-- Visual Bottom Box -->
    <rect x="20" y="144" width="324" height="54" rx="10" fill="#14161a" stroke="#2b3038" />
    <text x="36" y="176" fill="#fdba74" font-size="12.5" font-weight="600" class="sans">📁 Project Folder: Open</text>
    <text x="196" y="176" fill="#4b5563" font-size="12.5" class="sans">|</text>
    <text x="210" y="176" fill="#6ee7b7" font-size="12.5" font-weight="600" class="sans">🔒 System: Locked</text>
  </g>

  <!-- CARD 3: FULL SERVER ACCESS (Autonomous) -->
  <g transform="translate(808, 26)">
    <rect x="0" y="0" width="364" height="218" rx="16" fill="#1b1e24" stroke="#ef4444" stroke-width="1.5" />

    <!-- Badge -->
    <rect x="20" y="20" width="176" height="28" rx="14" fill="#3b0a0a" stroke="#ef4444" stroke-width="1" />
    <circle cx="38" cy="34" r="4.5" fill="#ef4444" />
    <text x="52" y="38" fill="#fca5a5" font-size="12" font-weight="700" class="sans">FULL SERVER ACCESS</text>

    <!-- Title & Plain Text -->
    <text x="20" y="76" fill="#ffffff" font-size="17" font-weight="700" class="sans">AI Manages the Whole Server</text>
    <text x="20" y="102" fill="#9ca3af" font-size="13" class="sans">The AI installs software, updates services, and</text>
    <text x="20" y="122" fill="#9ca3af" font-size="13" class="sans">repairs server issues all on its own.</text>

    <!-- Visual Bottom Box -->
    <rect x="20" y="144" width="324" height="54" rx="10" fill="#14161a" stroke="#2b3038" />
    <text x="36" y="176" fill="#fca5a5" font-size="12.5" font-weight="600" class="sans">⚡ Full Automation</text>
    <text x="166" y="176" fill="#4b5563" font-size="12.5" class="sans">+</text>
    <text x="184" y="176" fill="#6ee7b7" font-size="12.5" font-weight="600" class="sans">🛡️ Lockout Protection</text>
  </g>
</svg>
