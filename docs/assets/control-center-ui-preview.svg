<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 680" width="100%" height="100%">
  <defs>
    <pattern id="cc-dots" width="24" height="24" patternUnits="userSpaceOnUse">
      <circle cx="12" cy="12" r="1.2" fill="#272b33" />
    </pattern>
    <style>
      @keyframes cc-dash {
        from { stroke-dashoffset: 28; }
        to { stroke-dashoffset: 0; }
      }
      .cc-edge {
        stroke-dasharray: 7 7;
        animation: cc-dash 1.1s linear infinite;
      }
      .sans {
        font-family: -apple-system, BlinkMacSystemFont, "Inter", "Segoe UI", Roboto, sans-serif;
      }
    </style>
  </defs>

  <!-- Outer Browser Window -->
  <rect width="1280" height="680" rx="16" fill="#17191d" stroke="#2d323b" stroke-width="1.5" />

  <!-- Window Titlebar -->
  <rect x="1" y="1" width="1278" height="38" rx="15" fill="#121417" />
  <line x1="0" y1="39" x2="1280" y2="39" stroke="#252930" stroke-width="1" />
  <circle cx="22" cy="20" r="5.5" fill="#ef4444" opacity="0.85" />
  <circle cx="40" cy="20" r="5.5" fill="#f59e0b" opacity="0.85" />
  <circle cx="58" cy="20" r="5.5" fill="#10b981" opacity="0.85" />
  <rect x="490" y="8" width="300" height="22" rx="6" fill="#1b1e24" stroke="#2b3038" />
  <text x="640" y="23" text-anchor="middle" fill="#9ca3af" font-size="11.5" font-weight="500" class="sans">Synapse Control Center</text>

  <!-- 1. LEFT SIDEBAR (Simple Navigation) -->
  <rect x="1" y="40" width="214" height="639" fill="#17191d" />
  <line x1="215" y1="40" x2="215" y2="679" stroke="#252930" stroke-width="1" />

  <!-- Brand Header -->
  <rect x="18" y="56" width="34" height="34" rx="9" fill="#341b09" stroke="#f68330" stroke-width="1.2" />
  <circle cx="35" cy="66" r="2.8" fill="#f68330" />
  <circle cx="28" cy="78" r="2.8" fill="#f68330" />
  <circle cx="42" cy="78" r="2.8" fill="#f68330" />
  <path d="M 35 69 L 29 76 M 35 69 L 41 76 M 31 78 L 39 78" stroke="#f68330" stroke-width="1.6" />
  <text x="62" y="72" fill="#ffffff" font-size="16" font-weight="700" class="sans">Synapse</text>
  <text x="62" y="87" fill="#9ca3af" font-size="11" class="sans">Control Center</text>

  <!-- Project Dropdown -->
  <rect x="16" y="106" width="182" height="32" rx="8" fill="#20242a" stroke="#2e343e" />
  <text x="28" y="126" fill="#e5e7eb" font-size="12" font-weight="600" class="sans">My Cloud Project</text>
  <text x="180" y="126" fill="#9ca3af" font-size="11" class="sans">▾</text>

  <!-- Menu Items -->
  <g font-size="13" class="sans">
    <!-- Active Item -->
    <rect x="14" y="156" width="186" height="36" rx="9" fill="#262b33" />
    <circle cx="30" cy="174" r="4" fill="#f68330" />
    <text x="46" y="179" fill="#ffffff" font-weight="600">Overview Map</text>

    <text x="46" y="220" fill="#9ca3af" font-weight="500">Apps &amp; Websites</text>
    <text x="46" y="258" fill="#9ca3af" font-weight="500">Servers</text>
    <text x="46" y="296" fill="#9ca3af" font-weight="500">Project Memory</text>
    <text x="46" y="334" fill="#9ca3af" font-weight="500">Server Files</text>
    <text x="46" y="372" fill="#9ca3af" font-weight="500">Safety Rules</text>
    <text x="46" y="410" fill="#9ca3af" font-weight="500">Activity Log</text>
    <text x="46" y="448" fill="#9ca3af" font-weight="500">Settings</text>
  </g>

  <!-- Clean Status Footer (No version or protocol jargon) -->
  <rect x="16" y="624" width="182" height="38" rx="10" fill="#052e16" fill-opacity="0.5" stroke="#10b981" stroke-opacity="0.4" />
  <circle cx="34" cy="643" r="4.5" fill="#31c48d" />
  <text x="48" y="647" fill="#ecfdf5" font-size="12" font-weight="600" class="sans">All Systems Online</text>

  <!-- 2. TOP HEADER BAR -->
  <rect x="216" y="40" width="1063" height="50" fill="#17191d" />
  <line x1="216" y1="90" x2="1280" y2="90" stroke="#252930" stroke-width="1" />

  <text x="240" y="70" fill="#9ca3af" font-size="13.5" class="sans">My Cloud Project  /  <tspan fill="#ffffff" font-weight="700">Visual Overview</tspan></text>

