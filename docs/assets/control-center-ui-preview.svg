  <text x="1085" y="69" text-anchor="middle" fill="#fdba74" font-size="12" font-weight="600" class="sans">✦ AI Assistant</text>

  <rect x="1150" y="51" width="110" height="28" rx="8" fill="#f68330" />
  <text x="1205" y="69" text-anchor="middle" fill="#ffffff" font-size="12" font-weight="600" class="sans">+ Add Server</text>

  <!-- 3. CENTER VISUAL MAP (Servers -> Synapse Brain -> Running Apps) -->
  <rect x="216" y="91" width="694" height="546" fill="#14161a" />
  <rect x="216" y="91" width="694" height="546" fill="url(#cc-dots)" />

  <!-- Column Headers inside Canvas -->
  <text x="328" y="136" text-anchor="middle" fill="#9ca3af" font-size="11.5" font-weight="700" letter-spacing="0.8" class="sans">YOUR SERVERS</text>
  <text x="562" y="136" text-anchor="middle" fill="#9ca3af" font-size="11.5" font-weight="700" letter-spacing="0.8" class="sans">SYNAPSE BRAIN</text>
  <text x="796" y="136" text-anchor="middle" fill="#9ca3af" font-size="11.5" font-weight="700" letter-spacing="0.8" class="sans">YOUR APPS</text>

  <!-- Animated Connections: Servers -> Brain -->
  <path d="M 412 278 C 446 278, 446 340, 476 340" fill="none" stroke="#f68330" stroke-width="2.2" class="cc-edge" />
  <path d="M 412 402 C 446 402, 446 340, 476 340" fill="none" stroke="#f68330" stroke-width="2.2" class="cc-edge" />

  <!-- Animated Connections: Brain -> Running Apps -->
  <path d="M 648 340 C 682 340, 682 230, 712 230" fill="none" stroke="#38bdf8" stroke-width="2.2" class="cc-edge" />
  <path d="M 648 340 C 682 340, 682 340, 712 340" fill="none" stroke="#31c48d" stroke-width="2.2" class="cc-edge" />
  <path d="M 648 340 C 682 340, 682 450, 712 450" fill="none" stroke="#a855f7" stroke-width="2.2" class="cc-edge" />

  <!-- Left Column: 2 Clean Server Cards -->
  <g transform="translate(244, 240)">
    <rect x="0" y="0" width="168" height="76" rx="12" fill="#1e2228" stroke="#323842" stroke-width="1.5" />
    <circle cx="22" cy="28" r="4.5" fill="#31c48d" />
    <text x="34" y="32" fill="#ffffff" font-size="13.5" font-weight="700" class="sans">Web Server</text>
    <text x="22" y="54" fill="#9ca3af" font-size="11.5" class="sans">Linux · Connected</text>
    <circle cx="168" cy="38" r="4" fill="#14161a" stroke="#f68330" stroke-width="2" />
  </g>

  <g transform="translate(244, 364)">
    <rect x="0" y="0" width="168" height="76" rx="12" fill="#1e2228" stroke="#323842" stroke-width="1.5" />
    <circle cx="22" cy="28" r="4.5" fill="#31c48d" />
    <text x="34" y="32" fill="#ffffff" font-size="13.5" font-weight="700" class="sans">Database Server</text>
    <text x="22" y="54" fill="#9ca3af" font-size="11.5" class="sans">Linux · Connected</text>
    <circle cx="168" cy="38" r="4" fill="#14161a" stroke="#f68330" stroke-width="2" />
  </g>

  <!-- Center Column: Synapse Brain Hub -->
  <g transform="translate(476, 276)">
    <rect x="0" y="0" width="172" height="128" rx="16" fill="#1e2228" stroke="#f68330" stroke-width="1.8" />
    <rect x="16" y="16" width="32" height="32" rx="8" fill="#341b09" stroke="#f68330" />
    <circle cx="32" cy="32" r="5" fill="#f68330" />
    <text x="58" y="31" fill="#ffffff" font-size="14" font-weight="700" class="sans">Synapse Hub</text>
    <text x="58" y="47" fill="#fdba74" font-size="11" font-weight="600" class="sans">Central Brain</text>

    <line x1="16" y1="64" x2="156" y2="64" stroke="#2d323b" />

    <text x="18" y="86" fill="#6ee7b7" font-size="11.5" font-weight="600" class="sans">✓ Safety Rules On</text>
    <text x="18" y="108" fill="#7dd3fc" font-size="11.5" font-weight="600" class="sans">✓ Memory Saved</text>

    <circle cx="0" cy="64" r="4" fill="#14161a" stroke="#f68330" stroke-width="2" />
    <circle cx="172" cy="64" r="4" fill="#14161a" stroke="#38bdf8" stroke-width="2" />
  </g>

  <!-- Right Column: 3 Running Apps -->
  <g transform="translate(712, 192)">
    <rect x="0" y="0" width="168" height="76" rx="12" fill="#1e2228" stroke="#38bdf8" stroke-width="1.4" />
    <circle cx="0" cy="38" r="4" fill="#14161a" stroke="#38bdf8" stroke-width="2" />
    <circle cx="22" cy="28" r="4.5" fill="#31c48d" />
