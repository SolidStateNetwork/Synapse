    <text x="22" y="54" fill="#6ee7b7" font-size="11.5" font-weight="500" class="sans">⚡ Running Smoothly</text>
  </g>

  <g transform="translate(712, 412)">
    <rect x="0" y="0" width="168" height="76" rx="12" fill="#1e2228" stroke="#a855f7" stroke-width="1.4" />
    <circle cx="0" cy="38" r="4" fill="#14161a" stroke="#a855f7" stroke-width="2" />
    <circle cx="22" cy="28" r="4.5" fill="#31c48d" />
    <text x="34" y="32" fill="#ffffff" font-size="13.5" font-weight="700" class="sans">App Database</text>
    <text x="22" y="54" fill="#d8b4fe" font-size="11.5" font-weight="500" class="sans">🗄️ Data Protected</text>
  </g>

