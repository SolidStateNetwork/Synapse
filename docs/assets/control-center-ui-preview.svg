  <line x1="910" y1="91" x2="910" y2="679" stroke="#252930" stroke-width="1" />

  <!-- Chat Header -->
  <text x="934" y="122" fill="#ffffff" font-size="14" font-weight="700" class="sans">✦ Synapse AI Assistant</text>
  <rect x="1186" y="106" width="72" height="22" rx="11" fill="#052e16" stroke="#10b981" stroke-opacity="0.4" />
  <text x="1222" y="121" text-anchor="middle" fill="#6ee7b7" font-size="10.5" font-weight="600" class="sans">Ready</text>
  <line x1="910" y1="138" x2="1280" y2="138" stroke="#252930" stroke-width="1" />

  <!-- 1-Click Quick Actions Box -->
  <rect x="928" y="154" width="334" height="142" rx="12" fill="#1e2228" stroke="#2d323b" />
  <text x="944" y="178" fill="#9ca3af" font-size="11" font-weight="700" letter-spacing="0.5" class="sans">ONE-CLICK ACTIONS</text>

  <rect x="944" y="190" width="146" height="42" rx="8" fill="#052e16" fill-opacity="0.5" stroke="#10b981" stroke-opacity="0.4" />
  <text x="1017" y="216" text-anchor="middle" fill="#6ee7b7" font-size="12" font-weight="700" class="sans">🩺 Health Check</text>

  <rect x="1100" y="190" width="146" height="42" rx="8" fill="#082f49" fill-opacity="0.5" stroke="#38bdf8" stroke-opacity="0.4" />
  <text x="1173" y="216" text-anchor="middle" fill="#7dd3fc" font-size="12" font-weight="700" class="sans">🛡️ Security Check</text>

  <rect x="944" y="240" width="146" height="42" rx="8" fill="#2e1065" fill-opacity="0.5" stroke="#a855f7" stroke-opacity="0.4" />
  <text x="1017" y="266" text-anchor="middle" fill="#d8b4fe" font-size="12" font-weight="700" class="sans">🔍 Find Problems</text>

  <rect x="1100" y="240" width="146" height="42" rx="8" fill="#341b09" fill-opacity="0.6" stroke="#f68330" stroke-opacity="0.4" />
  <text x="1173" y="266" text-anchor="middle" fill="#fdba74" font-size="12" font-weight="700" class="sans">⬆️ Install Updates</text>

  <!-- User Message Bubble -->
  <rect x="984" y="314" width="278" height="44" rx="12" fill="#262b33" stroke="#363d49" />
  <text x="1002" y="341" fill="#ffffff" font-size="12.5" font-weight="500" class="sans">“Is everything running smoothly?”</text>

  <!-- AI Response Card -->
  <rect x="928" y="374" width="334" height="222" rx="12" fill="#1e2228" stroke="#10b981" stroke-opacity="0.5" />
  <circle cx="948" cy="398" r="5" fill="#31c48d" />
  <text x="962" y="402" fill="#ffffff" font-size="13" font-weight="700" class="sans">Everything looks great!</text>

  <text x="944" y="428" fill="#d1d5db" font-size="12" class="sans">I checked both servers and all running apps:</text>

  <!-- Clean Checklist -->
  <rect x="944" y="442" width="302" height="32" rx="7" fill="#14161a" />
  <text x="958" y="462" fill="#6ee7b7" font-size="12" font-weight="600" class="sans">✓ Web &amp; Database Servers are healthy</text>

  <rect x="944" y="480" width="302" height="32" rx="7" fill="#14161a" />
  <text x="958" y="500" fill="#6ee7b7" font-size="12" font-weight="600" class="sans">✓ Website &amp; Database are backed up</text>

  <!-- Step-by-step button inside AI reply -->
  <rect x="944" y="526" width="302" height="54" rx="9" fill="#29180b" stroke="#f68330" stroke-opacity="0.5" />
  <text x="958" y="548" fill="#ffffff" font-size="12" font-weight="700" class="sans">Want to walk through the details?</text>
  <text x="958" y="566" fill="#fdba74" font-size="11" class="sans">Review step by step with 1-click approval.</text>
  <rect x="1164" y="539" width="70" height="28" rx="6" fill="#f68330" />
  <text x="1199" y="557" text-anchor="middle" fill="#ffffff" font-size="11.5" font-weight="700" class="sans">Start</text>

  <!-- Chat Input Box -->
  <line x1="910" y1="614" x2="1279" y2="614" stroke="#252930" stroke-width="1" />
  <rect x="928" y="626" width="286" height="40" rx="9" fill="#20242a" stroke="#2e343e" />
  <text x="944" y="650" fill="#9ca3af" font-size="12" class="sans">Ask Synapse AI anything...</text>
  <rect x="1222" y="626" width="40" height="40" rx="9" fill="#f68330" />
  <text x="1242" y="651" text-anchor="middle" fill="#ffffff" font-size="14" font-weight="700" class="sans">➤</text>
