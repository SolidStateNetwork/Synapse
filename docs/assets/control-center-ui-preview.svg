  <g transform="translate(712, 302)">
    <rect x="0" y="0" width="168" height="76" rx="12" fill="#1e2228" stroke="#31c48d" stroke-width="1.4" />
    <circle cx="0" cy="38" r="4" fill="#14161a" stroke="#31c48d" stroke-width="2" />
    <circle cx="22" cy="28" r="4.5" fill="#31c48d" />
