services:
  core-gateway:
    image: ghcr.io/solidstatenetwork/synapse-core-gateway:latest
    build:
      context: .
      dockerfile: apps/core-gateway/Dockerfile
    container_name: synapse-core-gateway
    restart: unless-stopped
    environment:
      - SYNAPSE_DATA_DIR=/var/lib/synapse
      - SYNAPSE_TUNNEL_PORT=8443
      - SYNAPSE_GATEWAY_HTTP_ADDR=:8081
      - SYNAPSE_DEBUG=${SYNAPSE_DEBUG:-0}
    ports:
      - "8081:8081"
      - "8443:8443"
    volumes:
      - synapse_vault:/var/lib/synapse
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8081/healthz"]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 5s

  core-web:
    image: ghcr.io/solidstatenetwork/synapse-core-web:latest
    build:
      context: .
      dockerfile: apps/core-web/Dockerfile
    container_name: synapse-core-web
    restart: unless-stopped
    depends_on:
      core-gateway:
        condition: service_healthy
    environment:
      - NODE_ENV=production
      - PORT=3000
      - HOSTNAME=0.0.0.0
      - CORE_GATEWAY_URL=http://core-gateway:8081
      - NEXT_PUBLIC_GATEWAY_URL=${NEXT_PUBLIC_GATEWAY_URL:-}
      - SYNAPSE_VAULT_DIR=/var/lib/synapse/projects
      - SYNAPSE_CARTRIDGES_DIR=/app/cartridges
      - SYNAPSE_MASTER_KEY=${SYNAPSE_MASTER_KEY:-synapse-production-aes-256-gcm-master-key}
      - OPENAI_API_KEY=${OPENAI_API_KEY:-}
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY:-}
      - OLLAMA_BASE_URL=${OLLAMA_BASE_URL:-http://host.docker.internal:11434}
    ports:
      - "3000:3000"
    volumes:
      - synapse_vault:/var/lib/synapse
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:3000/api/projects"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 10s

volumes:
  synapse_vault:
