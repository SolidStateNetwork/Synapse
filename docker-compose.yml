services:
  core-gateway:
    build:
      context: .
      dockerfile: apps/core-gateway/Dockerfile
    container_name: synapse-core-gateway
    restart: unless-stopped
    ports:
      - "8443:8443" # Public mTLS Yamux Tunnel Listener for Muscle Nodes (Axon)
      - "127.0.0.1:8081:8081" # Internal HTTP API & Reverse Proxy for Core WebUI
    volumes:
      - synapse-data:/var/lib/synapse
    environment:
      - SYNAPSE_DATA_DIR=/var/lib/synapse
      - SYNAPSE_DEBUG=${SYNAPSE_DEBUG:-0}
      - SYNAPSE_PUBLIC_HOST=${SYNAPSE_PUBLIC_HOST:-}
    networks:
      - synapse-net
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8081/api/v1/status"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 5s

  core-web:
    build:
      context: .
      dockerfile: apps/core-web/Dockerfile
    container_name: synapse-core-web
    restart: unless-stopped
    ports:
      - "3000:3000" # Operator Control Center WebUI
    volumes:
      - synapse-data:/var/lib/synapse
    environment:
      - NODE_ENV=production
      - PORT=3000
      - HOSTNAME=0.0.0.0
      - SYNAPSE_DATA_DIR=/var/lib/synapse
      - SYNAPSE_GATEWAY_URL=http://core-gateway:8081
      - SYNAPSE_VAULT_SECRET=${SYNAPSE_VAULT_SECRET:-synapse-default-vault-secret}
    depends_on:
      core-gateway:
        condition: service_healthy
    networks:
      - synapse-net
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:3000/api/projects"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 10s

volumes:
  synapse-data:
    driver: local

networks:
  synapse-net:
    driver: bridge
